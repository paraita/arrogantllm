services:
  make-believe-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: make-believe-llm:local
    container_name: make-believe-llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
