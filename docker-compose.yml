services:
  arrogantllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: arrogantllm:local
    container_name: arrogantllm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
