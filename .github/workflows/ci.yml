name: CI and container release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  test:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Run dashboard tests
        run: npm run test:web
      - name: Build dashboard
        run: npm run build

  build-image:
    name: Build container (no publish)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: arrogantllm:ci
          cache-from: type=gha,scope=arrogantllm
          cache-to: type=gha,scope=arrogantllm,mode=max

  release-after-merge:
    name: Version, publish, and release merged PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Calculate and create next patch tag
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.merge_commit_sha;
            if (!sha) throw new Error('The merged pull request has no merge commit SHA.');
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              const tags = await github.paginate(github.rest.repos.listTags, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const versions = tags
                .map(({ name }) => name.match(/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/))
                .filter(Boolean)
                .map((match) => match.slice(1).map(Number))
                .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
              const latest = versions.at(-1) ?? [0, 0, 0];
              const next = `v${latest[0]}.${latest[1]}.${latest[2] + 1}`;
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${next}`,
                  sha,
                });
                core.setOutput('tag', next);
                core.setOutput('version', next.slice(1));
                core.info(`Created ${next} at ${sha}`);
                return;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 5) throw error;
                core.warning(`Tag ${next} already exists; recalculating version (attempt ${attempt + 1}).`);
              }
            }

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=ArrogantLLM
            org.opencontainers.image.description=Humorous OpenAI-compatible mock LLM API
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}
          cache-from: type=gha,scope=arrogantllm
          cache-to: type=gha,scope=arrogantllm,mode=max

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const notes = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
            });
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `ArrogantLLM ${tag}`,
              body: `${notes.data.body}\n\nDocker image: \`ghcr.io/${context.repo.owner}/${context.repo.repo}:${tag.slice(1)}\``,
              generate_release_notes: false,
              draft: false,
              prerelease: false,
            });

  publish-image:
    name: Publish SemVer release to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        id: semver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: $GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH tag."
          fi
      - name: Check out source
        if: steps.semver.outputs.valid == 'true'
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: steps.semver.outputs.valid == 'true'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: steps.semver.outputs.valid == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.semver.outputs.valid == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        if: steps.semver.outputs.valid == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=ArrogantLLM
            org.opencontainers.image.description=Humorous OpenAI-compatible mock LLM API
      - name: Build and publish versioned image
        if: steps.semver.outputs.valid == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arrogantllm
          cache-to: type=gha,scope=arrogantllm,mode=max
