name: CI and container release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Run dashboard tests
        run: npm run test:web
      - name: Build dashboard
        run: npm run build

  build-image:
    name: Build container (no publish)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: arrogantllm:ci
          cache-from: type=gha,scope=arrogantllm
          cache-to: type=gha,scope=arrogantllm,mode=max

  publish-image:
    name: Publish SemVer release to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        id: semver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: $GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH tag."
          fi
      - name: Check out source
        if: steps.semver.outputs.valid == 'true'
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        if: steps.semver.outputs.valid == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.semver.outputs.valid == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        if: steps.semver.outputs.valid == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Make Believe LLM
            org.opencontainers.image.description=Humorous OpenAI-compatible mock LLM API
      - name: Build and publish versioned image
        if: steps.semver.outputs.valid == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arrogantllm
          cache-to: type=gha,scope=arrogantllm,mode=max
